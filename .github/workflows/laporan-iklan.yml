name: Laporan Iklan Lovamily

# Berjalan di cloud GitHub — TIDAK butuh PC menyala.
#
# PENJADWALAN ADA DI CLOUDFLARE WORKER, bukan di sini.
# Cron GitHub Actions terbukti tidak andal untuk repo yang jarang di-push
# (jadwal di-skip diam-diam). Cloudflare Cron Triggers memicu
# repository_dispatch di bawah pada jadwal:
#   00:00 UTC harian        -> 07:00 WIB -> mode harian
#   00:30 UTC Senin         -> 07:30 WIB -> mode mingguan
# Lihat tools/laporan-iklan/cloudflare-worker/.
#
# repository_dispatch juga dipicu Worker saat ada perintah
# "/laporan [harian|mingguan]" di grup Telegram (on-demand).

on:
  workflow_dispatch:          # tombol "Run workflow" manual di tab Actions
    inputs:
      mode:
        description: "Mode laporan"
        required: true
        default: "harian"
        type: choice
        options: [harian, mingguan]
  repository_dispatch:
    types: [laporan_iklan]

concurrency:
  group: laporan-iklan
  cancel-in-progress: false

jobs:
  laporan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Tentukan mode
        id: mode
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "value=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT" ;;
            repository_dispatch)
              m="${{ github.event.client_payload.mode }}"
              [ "$m" = "mingguan" ] || m="harian"
              echo "value=$m" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "value=harian" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Kirim laporan
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/laporan-iklan/laporan_harian_iklan.py "${{ steps.mode.outputs.value }}"
